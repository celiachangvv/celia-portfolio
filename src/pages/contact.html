<template page>

                <p>Let get in touch</p>
                <h1>Contact <span>Me</span></h1>

        </div>
        <main class="homepage-main" style="margin-top: 5rem; margin-bottom: 5rem;">
            <div class="contact-find-me">
                <div class="send-me-form">
                    <div class="container">

                            <label>
                                Your Name
                                <input type="text" id="name" name="name" placeholder="Name">

                            <label>
                                Email
                                <input type="email" id="email" name="email" placeholder="Email">

                            <label>
