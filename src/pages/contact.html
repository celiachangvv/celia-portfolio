<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Celia Portfolio</title>
    <link rel="stylesheet" href="/src/style/style.css" />
    <link rel="stylesheet" href="/src/style/global.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="./public/assets/logo/favicon-2.webp"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- library  -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js/dist/ofa.min.js"></script>
  </head>
  <l-m src="/src/components/common/my-layout.html"></l-m>
  <l-m src="/src/components/home/hero-img.html"></l-m>
  <l-m src="/src/components/home/my-work.html"></l-m>
  <l-m src="/src/components/home/can-do.html"></l-m>
  <l-m src="/src/components/home/about-me.html"></l-m>

  <body>
    <my-layout>
      <header class="other-header">
        <div class="other-header-title">
          <p>Let get in touch</p>
          <h1>Contact <span>Me</span></h1>
        </div>
      </header>

      <main style="margin-top: 5rem; margin-bottom: 5rem;">
        <div class="contact-find-me">
          <div class="send-me-form">
            <div class="container">
              <form action="https://formspree.io/f/xdojjgqd" method="POST">
                <label>
                  Your Name
                  <input type="text" id="name" name="name" placeholder="Name" />
                </label>

                <label>
                  Email
                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                  />
                </label>

                <label>
                  Message
                  <textarea
                    id="message"
                    name="message"
                    placeholder="Tell me what you want to say"
                    style="height: 200px"
                  ></textarea>
                </label>

                <input type="submit" value="Submit" />
              </form>
            </div>
          </div>
        </div>
      </main>
    </my-layout>
  </body>
</html>
